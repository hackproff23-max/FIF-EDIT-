name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar app web
        run: mkdir -p www && cp index.html www/index.html
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Adicionar janela flutuante
        run: |
          D=android/app/src/main/java/com/hackproff/fifedit
          mkdir -p $D
          cp native/*.java $D/
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FIF-EDIT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FIF-EDIT-apk
          path: FIF-EDIT.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FIF-EDIT (APK mais recente)
          files: FIF-EDIT.apk
          make_latest: true
